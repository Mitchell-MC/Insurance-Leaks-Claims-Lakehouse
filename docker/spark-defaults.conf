# Injects the Delta config that main.py's bare
# SparkSession.builder.appName("lakehouse").getOrCreate() has no code path
# to set itself -- a real Databricks cluster provides equivalent config
# ambiently, so this file only exists in the Docker image, never on a real
# cluster, and main.py needs zero changes either way. Verified by the
# docker-smoke CI job (a real container run against a real Delta read), not
# a Python unit test -- see docs/architecture_ideal_vs_actual.md's "Local
# validation (Docker Compose)" section for why a unit test here would be
# tautological (it could only assert this file's contents, not that Spark
# actually honors it at runtime).

# Reason: matches src/lakehouse/conftest.py's proven-working local[1] +
# 1-partition shuffle config for a single-container simulation.
spark.master                             local[1]
spark.sql.shuffle.partitions             1
spark.sql.extensions                    io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog         org.apache.spark.sql.delta.catalog.DeltaCatalog

# Reason: spark.jars.packages (which puts the Delta jars on the classpath
# at session startup) is appended here at build time by
# docker/warm_delta_cache.py, which derives the exact Delta artifact
# coordinate from the installed delta-spark version instead of hardcoding
# it -- see that script and the Dockerfile's RUN step.

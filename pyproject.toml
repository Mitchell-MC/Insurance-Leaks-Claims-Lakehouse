[project]
name = "lakehouse"
version = "0.1.0"
description = "Insurance Claims Leakage & Catastrophe Response Analytics Lakehouse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyspark>=3.5.0",
    "delta-spark>=3.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "databricks-sdk>=0.28.0",
    "requests>=2.32.0",
]

[project.scripts]
lakehouse = "lakehouse.main:main"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "chispa>=0.10.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["src"]
